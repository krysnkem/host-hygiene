# Builds the interface for both chips on native runners and tests it. A push to main that bumps VERSION to a version
# with no tag yet, and whose build and tests pass, is released: CI creates the tag, publishes the release and updates the Homebrew tap.
#   - pull request, or a push to main that does not bump VERSION : build and test only
#   - push to main with a new VERSION                            : build, test, tag, release, tap update
#   - "Run workflow" (workflow_dispatch)                         : build and test only (a dry run; nothing is published)
# The terminal tests (they drive the real interface in a pty) report but do not gate: they are timing-sensitive on shared runners.
# Third-party actions are pinned to a full commit SHA (the comment names the version).
name: release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'brand/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'brand/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DART_VERSION: '3.9.2'

jobs:
  # Decides whether this run may release: only a push to main whose VERSION has no tag yet.
  plan:
    name: should this release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.p.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat VERSION)"; R=false
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$V" >/dev/null 2>&1; then echo "v$V already exists: test only"
            elif ! grep -q "^## $V" CHANGELOG.md; then echo "CHANGELOG.md has no entry for $V"; exit 1
            else R=true; echo "v$V is new: will release if the tests pass"; fi
          else echo "not a push to main: test only"; fi
          echo "release=$R" >> "$GITHUB_OUTPUT"
  build:
    name: build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
          - arch: x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: ${{ env.DART_VERSION }}
      - name: This runner
        run: |
          uname -m
          dart --version
          [ "$(uname -m)" = "${{ matrix.arch }}" ]
      - name: Analyze and unit tests
        working-directory: tui
        run: |
          dart pub get
          dart analyze
          dart run tests/home_model.dart
      - name: Compile
        working-directory: tui
        run: |
          dart compile exe -DHH_VERSION="$(cat ../VERSION)" bin/hh_tui.dart -o hh_tui-${{ matrix.arch }}
          file hh_tui-${{ matrix.arch }}
          ./hh_tui-${{ matrix.arch }} --version
          ./hh_tui-${{ matrix.arch }} --version | grep -q "$(cat ../VERSION) macos_${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}"
      - name: Shell suites
        run: |
          cp tui/hh_tui-${{ matrix.arch }} tui/hh_tui
          for t in check-arch check-apply check-apps check-schedule; do echo "== $t"; bash tests/$t.sh; done
          rm tui/hh_tui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hh_tui-${{ matrix.arch }}
          path: tui/hh_tui-${{ matrix.arch }}
          if-no-files-found: error

  # Drives the real interface in a terminal. Timing-sensitive on shared runners, so it reports but does not gate the release.
  terminal-tests:
    name: terminal tests ${{ matrix.arch }}
    needs: build
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
          - arch: x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hh_tui-${{ matrix.arch }}
          path: tui
      - name: Tests
        run: |
          chmod +x tui/hh_tui-${{ matrix.arch }}
          cp tui/hh_tui-${{ matrix.arch }} tui/hh_tui
          python3 -m venv "$RUNNER_TEMP/py" && "$RUNNER_TEMP/py/bin/pip" install --quiet pyte
          export HH_PYTHON="$RUNNER_TEMP/py/bin/python"
          for t in check-home check-chooser; do echo "== $t"; bash tests/$t.sh "$RUNNER_TEMP/$t"; rm -rf "$RUNNER_TEMP/$t"; done

  release:
    name: publish the release
    if: needs.plan.outputs.release == 'true'
    needs: [plan, build]
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hh_tui-*
          path: bin
          merge-multiple: true
      - name: Build the archive
        run: |
          chmod +x bin/*
          HH_BIN_ARM64=bin/hh_tui-arm64 HH_BIN_X64=bin/hh_tui-x86_64 tools/make-release.sh dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat VERSION)"; TAG="v$V"
          awk -v v="$V" '$0 ~ "^## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "host hygiene $V" > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" "dist/host-hygiene-$V.tar.gz" "dist/host-hygiene-$V.tar.gz.sha256" --title "host hygiene $V" --notes-file notes.md
      - name: Keep the checksum for the tap job
        run: cut -d' ' -f1 "dist/host-hygiene-$(cat VERSION).tar.gz.sha256" > sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-info
          path: |
            sha256.txt
            VERSION

  update-tap:
    name: update the Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-info
          path: info
      - name: Set up SSH for the tap (a deploy key limited to that one repository)
        env:
          KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "the TAP_DEPLOY_KEY secret is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/tap_key && chmod 600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts 2>/dev/null
          # GitHub's published ed25519 host key fingerprint
          ssh-keygen -lf ~/.ssh/known_hosts | grep -q 'SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU' || { echo "unexpected github.com host key"; exit 1; }
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Update the formula
        run: |
          V="$(cat info/VERSION)"; H="$(cat info/sha256.txt)"
          git clone --depth 1 git@github.com:krysnkem/homebrew-tap.git tap
          mkdir -p tap/Formula
          tools/render-formula.sh "$V" "$H" > tap/Formula/host-hygiene.rb
          cd tap
          git config user.name "host-hygiene release"
          git config user.email "noreply@users.noreply.github.com"
          git add Formula/host-hygiene.rb
          git diff --cached --quiet && { echo "the formula is already up to date"; exit 0; }
          git commit -m "host-hygiene $V"
          git push origin HEAD:main
